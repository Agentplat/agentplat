packages:
  - "packages/*"

overrides:
  "@grpc/grpc-js": 1.14.5
  fast-uri: 3.1.8
  hono: 4.13.9
  ip-address: 10.7.1
  "@hono/node-server": ">=1.19.15"
  qs: 6.16.0
  source-map-js: 1.2.2
  proxy-addr: 2.0.8
  "@modelcontextprotocol/client": 2.2.0
  "@modelcontextprotocol/sdk": 1.31.0

# Registry packages may not introduce git, URL, tarball, file, or directory
# dependencies transitively. Workspace links remain explicit in package manifests.
blockExoticSubdeps: true

# Unreviewed dependency lifecycle scripts are a release-supply-chain boundary.
# Populate this map only for packages whose exact version and build behavior have
# been reviewed. pnpm 11 fails the install when an undeclared build is observed.
allowBuilds:
  # Vitest uses the platform binary from optional dependencies; install hooks stay disabled.
  esbuild: false
  "@swc/core": true
  protobufjs: true
