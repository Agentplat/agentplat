<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="640" viewBox="0 0 1450 640">
  <defs><style>.title{font-family:Arial,sans-serif;font-size:30px;font-weight:700;fill:#17202a}.label{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#17202a}.body{font-family:Arial,sans-serif;font-size:17px;fill:#3f4b57}.box{rx:16;stroke-width:3}.arrow{stroke:#456b8a;stroke-width:4;fill:none;marker-end:url(#a)}.stale{stroke:#a23b3b;stroke-width:4;fill:none;stroke-dasharray:10 8;marker-end:url(#d)}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#456b8a"/></marker><marker id="d" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#a23b3b"/></marker></defs>
  <rect width="1450" height="640" fill="white"/><text x="725" y="45" text-anchor="middle" class="title">Fenced recovery after lease expiry</text>
  <rect x="60" y="105" width="280" height="125" class="box" fill="#eef5fa" stroke="#2e74b5"/><text x="200" y="148" text-anchor="middle" class="label">Executor B</text><text x="200" y="180" text-anchor="middle" class="body">Epoch 1 · fence 41</text><text x="200" y="208" text-anchor="middle" class="body">Lease expires</text>
  <path d="M340 168 L420 168" class="arrow"/><rect x="420" y="105" width="280" height="125" class="box" fill="#fff5df" stroke="#b57a15"/><text x="560" y="148" text-anchor="middle" class="label">Recovery witnesses</text><text x="560" y="180" text-anchor="middle" class="body">Grace elapsed · one vote</text><text x="560" y="208" text-anchor="middle" class="body">per next-epoch coordinate</text>
  <text x="380" y="178" text-anchor="middle" class="label" fill="#456b8a">→</text>
  <path d="M700 168 L780 168" class="arrow"/><rect x="780" y="105" width="280" height="125" class="box" fill="#eef5fa" stroke="#2e74b5"/><text x="920" y="148" text-anchor="middle" class="label">Recovery certificate</text><text x="920" y="180" text-anchor="middle" class="body">Epoch 2 · fence 42</text><text x="920" y="208" text-anchor="middle" class="body">Threshold + exact scope</text>
  <text x="740" y="178" text-anchor="middle" class="label" fill="#456b8a">→</text>
  <path d="M1060 168 L1140 168" class="arrow"/><rect x="1140" y="105" width="250" height="125" class="box" fill="#e5f4ea" stroke="#2d7d46"/><text x="1265" y="148" text-anchor="middle" class="label">Executor C</text><text x="1265" y="180" text-anchor="middle" class="body">Accepts epoch 2</text><text x="1265" y="208" text-anchor="middle" class="body">Resumes checkpoint</text>
  <text x="1100" y="178" text-anchor="middle" class="label" fill="#456b8a">→</text>
  <path d="M1265 230 L1265 315" class="arrow"/><rect x="1090" y="315" width="350" height="110" class="box" fill="#dff1e5" stroke="#2d7d46"/><text x="1265" y="358" text-anchor="middle" class="label">Effect sink head = fence 42</text><text x="1265" y="392" text-anchor="middle" class="body">C's exact effect may be evaluated</text>
  <text x="1265" y="275" text-anchor="middle" class="label" fill="#456b8a">↓</text>
  <path d="M200 230 C200 420 650 520 1085 385" class="stale"/><rect x="405" y="400" width="420" height="105" class="box" fill="#fae6e6" stroke="#a23b3b"/><text x="615" y="442" text-anchor="middle" class="label">B returns with fence 41</text><text x="615" y="477" text-anchor="middle" class="body">Rejected as stale even if B was once valid</text>
  <text x="300" y="335" text-anchor="middle" class="label" fill="#a23b3b">↘</text><text x="910" y="430" text-anchor="middle" class="label" fill="#a23b3b">✕</text>
  <text x="725" y="585" text-anchor="middle" class="body">Safety depends on the downstream sink atomically comparing the submitted fence with its current head.</text>
</svg>
