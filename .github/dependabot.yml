version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /examples/next-multi-agent-sse
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      example-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /examples/rooms-api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      example-dependencies:
        patterns:
          - "*"
