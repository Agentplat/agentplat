name: Release packages

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm distribution tag
        required: true
        default: next
        type: choice
        options:
          - next
          - latest
      dry_run:
        description: simulate publishing without changing npm registry state
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Prepare required public terminology denylist
        shell: bash
        env:
          AGENTPLAT_PUBLIC_DENYLIST: ${{ secrets.AGENTPLAT_PUBLIC_DENYLIST }}
        run: |
          if [ -z "${AGENTPLAT_PUBLIC_DENYLIST:-}" ]; then
            echo "The release terminology denylist secret is required." >&2
            exit 1
          fi
          umask 077
          denylist_path="${RUNNER_TEMP}/agentplat-public-terminology.txt"
          printf '%s\n' "${AGENTPLAT_PUBLIC_DENYLIST}" > "${denylist_path}"
          echo "AGENTPLAT_PUBLIC_DENYLIST_FILE=${denylist_path}" >> "${GITHUB_ENV}"
      - name: Run release audit and full verification
        run: |
          pnpm run audit:public:release
          pnpm run check
      - name: Dry-run package publication
        if: ${{ inputs.dry_run }}
        run: node scripts/publish-packages.mjs
        env:
          NPM_DIST_TAG: ${{ inputs.dist_tag }}
          NPM_PUBLISH_DRY_RUN: '1'
      - name: Publish packages
        if: ${{ !inputs.dry_run }}
        run: node scripts/publish-packages.mjs
        env:
          NPM_DIST_TAG: ${{ inputs.dist_tag }}
          NPM_PUBLISH_DRY_RUN: '0'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify exact packages from a clean registry consumer
        if: ${{ !inputs.dry_run }}
        run: pnpm run verify:registry-consumer
