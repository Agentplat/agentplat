name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentplat_test
          POSTGRES_USER: agentplat_test
          POSTGRES_PASSWORD: agentplat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentplat_test -d agentplat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      temporal:
        image: temporalio/auto-setup:1.29.7
        env:
          DB: postgres12
          DB_PORT: "5432"
          POSTGRES_SEEDS: postgres
          POSTGRES_USER: agentplat_test
          POSTGRES_PWD: agentplat_test
        ports:
          - 7233:7233
        options: >-
          --health-cmd "temporal operator cluster health --address temporal:7233"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm --filter @agentplat/sessions-redis test
      - run: pnpm --filter @agentplat/audit-postgres test
        env:
          AGENTPLAT_POSTGRES_TEST: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: agentplat_test
          PGUSER: agentplat_test
          PGPASSWORD: agentplat_test
      - run: pnpm --filter @agentplat/interop-postgres test
        env:
          AGENTPLAT_POSTGRES_TEST: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: agentplat_test
          PGUSER: agentplat_test
          PGPASSWORD: agentplat_test
      - run: pnpm --filter @agentplat/mesh-postgres test
        env:
          AGENTPLAT_POSTGRES_TEST: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: agentplat_test
          PGUSER: agentplat_test
          PGPASSWORD: agentplat_test
      - run: pnpm --filter @agentplat/collective-control-postgres test
        env:
          AGENTPLAT_POSTGRES_TEST: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: agentplat_test
          PGUSER: agentplat_test
          PGPASSWORD: agentplat_test
      - run: pnpm --filter @agentplat/mesh-sim-postgres test
        env:
          AGENTPLAT_POSTGRES_TEST: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: agentplat_test
          PGUSER: agentplat_test
          PGPASSWORD: agentplat_test
      - name: Verify Mesh PostgreSQL fault matrix, soak and benchmark
        run: |
          pnpm run verify:mesh-postgres-faults
          pnpm run verify:mesh-soak -- --messages 9 --repetitions 2
          pnpm run benchmark:mesh-adapters
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: agentplat_test
          PGUSER: agentplat_test
          PGPASSWORD: agentplat_test
      - run: pnpm --filter @agentplat/rooms-postgres test
        env:
          AGENTPLAT_POSTGRES_TEST: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: agentplat_test
          PGUSER: agentplat_test
          PGPASSWORD: agentplat_test
      - run: pnpm --filter @agentplat/workflows-postgres test
        env:
          AGENTPLAT_POSTGRES_TEST: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: agentplat_test
          PGUSER: agentplat_test
          PGPASSWORD: agentplat_test
      - run: pnpm --filter @agentplat/autonomy-postgres test
        env:
          AGENTPLAT_POSTGRES_TEST: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: agentplat_test
          PGUSER: agentplat_test
          PGPASSWORD: agentplat_test
      - run: pnpm --filter @agentplat/workflows-temporal test:real
        env:
          TEMPORAL_ADDRESS: 127.0.0.1:7233

  node22-npm-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
      - run: pnpm run build
      - name: Verify packed plain-ESM npm consumer under Node 22
        run: pnpm run verify:pack
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
