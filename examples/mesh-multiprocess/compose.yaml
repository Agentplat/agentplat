services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentplat_mesh_demo
      POSTGRES_USER: agentplat
      POSTGRES_PASSWORD: agentplat
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentplat -d agentplat_mesh_demo"]
      interval: 1s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
